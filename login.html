<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazan Medicine Comapny</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Refreshed login theme using #04792d and white */
    :root {
      color-scheme: only light;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #ffffff;
      color: #04792d;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, 'Helvetica Neue', Arial;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      border: 2px solid #04792d;
      box-shadow: 0 18px 45px rgba(4, 121, 45, 0.18);
    }
    .login-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .login-header img {
      width: 160px;
      height: auto;
     
    }
    .login-header h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 700;
      color: #04792d;
    }
    .muted {
      color: #04792d;
      opacity: .75;
      font-size: 13px;
      margin-top: -4px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #04792d;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input[type="email"],
    input[type="password"] {
      width: 92%;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid #04792d;
      background: #ffffff;
      color: #04792d;
      padding: 0 14px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
      font-size: 14px;
    }
    input::placeholder {
      color: rgba(4, 121, 45, 0.6);
    }
    input:focus {
      border-color: #04792d;
      box-shadow: 0 0 0 3px rgba(4, 121, 45, 0.18);
    }
    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: #04792d;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      margin-top: 20px;
      transition: transform .05s ease, box-shadow .2s ease;
      box-shadow: 0 10px 24px rgba(4, 121, 45, 0.25);
    }
    .btn:hover {
      box-shadow: 0 14px 32px rgba(4, 121, 45, 0.32);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .error {
      margin-top: 12px;
      color: #04792d;
      font-size: 12px;
      min-height: 16px;
    }
    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #04792d;
      opacity: .85;
      letter-spacing: .03em;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="w-100 text-center">
        <img src="assets/logo.png" alt="Company Logo">
        <div class="muted">Secure sign-in to continue</div>
      </div>
    </div>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign In</button>
      <div id="error" class="error"></div>
    </form>
    <div class="foot">Access is based on assigned modules</div>
  </div>

  <script>
    // Always show login page - no auto-login
    // Clear any existing session on page load
    localStorage.removeItem('erpSession');
    localStorage.removeItem('lastPage');

    const API_BASE = window.API_BASE ?? 'http://84.247.169.194:3000';

    function mapModuleLabelToPageId(label) {
      if (!label) return null;
      const lower = String(label).toLowerCase();
      // Sales modules
      if (lower.includes('sale booking') || lower.startsWith('1.2')) return 'page-sale-booking';
      if (lower.includes('generate booking invoice') || lower.startsWith('1.3')) return 'page-generate-invoice';
      if (lower.includes('controlled invoice') || lower.startsWith('1.4')) return 'page-controlled-invoice';
      if (lower.includes('open invoice') || lower.startsWith('1.5')) return 'page-open-invoice';
      if (lower.includes('sales return') || lower.startsWith('1.6')) return 'page-sales-returns';
      if (lower.includes('customer receipt') || lower.startsWith('1.7')) return 'page-customer-receipt';
      if (lower.includes('stock adjustment') || lower.startsWith('1.8')) return 'page-stock-adjustment';
      if (lower.includes('delivery summary') || lower.startsWith('1.9')) return 'page-delivery-summary';
      if (lower.includes('summary collection') || lower.startsWith('1.10')) return 'page-summary-collection';
      // Claims modules (2.x)
      if (lower.includes('discount claim') || lower.startsWith('2.1')) return 'page-discount-claim';
      if (lower.includes('bonus claim') || lower.startsWith('2.2')) return 'page-bonus-claim';
      if (lower.includes('claims adjustment') || lower.startsWith('2.3')) return 'page-claims-adjustment';
      if (lower.includes('open claim') || lower.startsWith('2.4')) return 'page-open-claim';
      if (lower.includes('store expiry') || lower.startsWith('2.5')) return 'page-store-expiry';
      if (lower.includes('market expiry') || lower.startsWith('2.6')) return 'page-market-expiry';
      if (lower.includes('regenerate expiry') || lower.startsWith('2.7')) return 'page-regenerate-expiry';
      // Admin and roles
      if (lower.includes('roles & permissions') || lower.includes('roles and permissions') || lower.startsWith('17.1')) return 'page-roles-permissions';
      if (lower.includes('salesman department') || lower.startsWith('18.1')) return 'page-salesman-department';
      // Fallback to dashboard
      return 'page-dashboard';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        errorEl.textContent = 'Please enter both email and password.';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          errorEl.textContent = data && data.error ? data.error : 'Login failed';
          return;
        }
        // Determine initial page by first assigned module
        const firstModule = (data.assignedModule || (Array.isArray(data.modules) ? data.modules[0] : null)) || '';
        const initialPage = mapModuleLabelToPageId(firstModule);
        // Persist session + desired landing page
        localStorage.setItem('erpSession', JSON.stringify({
          user: data.user,
          modules: data.modules || [],
          loggedInAt: Date.now()
        }));
        localStorage.setItem('lastPage', initialPage || 'page-dashboard');
        // Go to main app
        window.location.href = 'index.html';
      } catch (err) {
        errorEl.textContent = 'Unable to connect to server. Please try again.';
      }
    });
  </script>
</body>
</html>
